# Strategic-merge patch: adds the postgres_exporter sidecar to the
# operator-managed search-postgres deployment (Search CR reconciliation must be paused).
# Apply with:
#   oc patch deployment search-postgres -n open-cluster-management \
#     --type=strategic --patch-file deploy/acm-search/03-sidecar-patch.yaml
spec:
  template:
    spec:
      containers:
      - name: prometheus-postgres-exporter
        image: registry.redhat.io/multicluster-globalhub/multicluster-globalhub-postgres-exporter-rhel9:63c35310c8b87f1a1231c505f70cab89f5ad5031
        imagePullPolicy: IfNotPresent
        args:
        - "--web.listen-address=:9187"
        env:
        - name: DATA_SOURCE_URI
          value: "localhost:5432/search?sslmode=disable"
        - name: DATA_SOURCE_USER
          valueFrom:
            secretKeyRef:
              name: search-postgres
              key: database-user
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: search-postgres
              key: database-password
        ports:
        - name: metrics
          containerPort: 9187
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: metrics
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /
            port: metrics
          timeoutSeconds: 1
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
